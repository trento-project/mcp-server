---
name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - "VERSION"
      - "CHANGELOG.md"
    tags-ignore:
      - "*"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "VERSION"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run all the linters.
  linters-run:
    name: Run all linters
    uses: ./.github/workflows/linters.yaml
    secrets: inherit

  # Check the result of all linters and fail if any linter failed.
  linters-result:
    name: Check linters result
    if: always()
    needs: linters-run
    runs-on: ubuntu-24.04
    steps:
      # Fail the job if any linter did not succeed.
      - name: Check all linters result
        if: needs.linters-run.result != 'success'
        run: exit 1

  # Check go unit tests.
  test-with-go:
    name: Check Go test suite
    runs-on: ubuntu-24.04
    steps:
      # Checkout the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout
      # Read tool versions for environment setup.
      - uses: endorama/asdf-parse-tool-versions@e60863920ff5af9bf1c794ffbaaef91384b07eed # v1.6.0
        name: Read .tool-versions
        id: tool-versions
      # Setup Go environment.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GOLANG_VERSION }}
      # Cache Go modules for faster builds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        name: Cache Go modules
        id: go-cache
        with:
          path: ~/go/pkg/mod
          key: go-${{ env.GOLANG_VERSION }}-${{ hashFiles('**/go.sum') }}
      # Run Go unit tests.
      - name: Run go unit tests
        run: make test

  publish-containers:
    name: Publish GHCR Containers
    needs:
      - test-with-go
      - linters-result
    if: github.event_name == 'push'
    uses: trento-project/.github/.github/workflows/publish-containers.yaml@7ea6a8a1c3ed8a1f2185328219be4a724dd3686e # v1.8.0
    with:
      image_name: mcp-server-trento
      tag: rolling
    secrets:
      gh_token: ${{ secrets.TRENTOBOT_GH_PAT }}
      ssh_key: ${{ secrets.TRENTOBOT_SSH_KEY }}

  # Update sum.golang.org and pkg.go.dev.
  generate-docs:
    name: Update Go docs site
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs:
      - publish-containers
      - test-with-go
      - linters-result
    steps:
      # Trigger docs update in Go registries.
      - uses: essentialkaos/godoc-action@1d99db5d7f1c4fc42d26c9910ea374053d6961fb # v1
        name: Trigger docs update in sum.golang.org and pkg.go.dev

  # Sync the project with OBS (Open Build Service).
  obs-sync:
    name: Update OBS packages
    if: fromJSON(vars.OBS_ENABLED) && github.event_name == 'push'
    uses: trento-project/.github/.github/workflows/obs-sync.yaml@7ea6a8a1c3ed8a1f2185328219be4a724dd3686e # v1.8.0
    needs:
      - publish-containers
      - test-with-go
      - linters-result
    with:
      obs_project: ${{ vars.OBS_PROJECT_ROLLING }}
      obs_package: ${{ vars.OBS_PACKAGE }}
    secrets:
      gh_token: ${{ secrets.TRENTOBOT_GH_PAT }}
      obs_user: ${{ secrets.OBS_USER }}
      obs_pass: ${{ secrets.OBS_PASS }}
      obs_ssh_key: ${{ secrets.OBS_SSH_KEY }}
